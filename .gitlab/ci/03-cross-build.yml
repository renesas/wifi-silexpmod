generate_release_html:
  stage: cross_build

  image:
    name: pandoc/core:3.11.0
    entrypoint: [""]

  variables:
    # Have GitLab Runner initialize the html-style submodule.
    GIT_SUBMODULE_STRATEGY: normal
    GIT_SUBMODULE_PATHS: "html-style"

    # Add additional Markdown files on separate lines if the
    # documentation consists of multiple files.
    HTML_INPUT_FILES: |
      doc/README.md

    HTML_OUTPUT_FILE: "index.html"

  script:
    - |
      echo "Generating ${HTML_OUTPUT_FILE} from:"
      echo "${HTML_INPUT_FILES}"

      INPUT_FILES=""

      while IFS= read -r input; do
        [ -z "${input}" ] && continue

        if [ ! -f "${input}" ]; then
          echo "ERROR: Markdown file not found: ${input}"
          exit 1
        fi

        INPUT_FILES="${INPUT_FILES} ${input}"
      done <<EOF
      ${HTML_INPUT_FILES}
      EOF

      echo "Running Pandoc..."

      pandoc ${INPUT_FILES} \
        -f markdown+gfm_auto_identifiers \
        -s \
        --embed-resources \
        --css html-style/xplore-doc-style.css \
        --resource-path=.:doc \
        -o "${HTML_OUTPUT_FILE}"

  artifacts:
    paths:
      - index.html
    expire_in: 1 week
